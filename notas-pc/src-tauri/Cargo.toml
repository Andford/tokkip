[package]
name = "tokkip-notas"
description = "Tokkip Notas para Windows: tus páginas, tableros y tablas, con el diseño de Tokkip"
authors = ["Andy (LoperStack)"]
version = "0.3.1"
edition = "2021"
license = "MIT"

[lib]
name = "tokkip_notas_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# The pages live in SQLite, like on Android (the same table). Bundled, so
# nothing has to be installed on the PC.
rusqlite = { version = "0.32", features = ["bundled"] }
# Sync with your own server (sync.rs): HTTPS, and the pages encrypted with a
# key from your phrase (AES-256-GCM, PBKDF2-SHA256).
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
aes-gcm = "0.10"
pbkdf2 = { version = "0.12", default-features = false, features = ["hmac"] }
sha2 = "0.10"
base64 = "0.22"
getrandom = "0.2"
unicode-normalization = "0.1"

# The sync key and phrase live in Windows' Credential Manager.
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[profile.dev.package."*"]
# PBKDF2 and AES are slow unoptimised; tests and `tauri dev` stay quick.
opt-level = 2

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
